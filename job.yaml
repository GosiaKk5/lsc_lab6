apiVersion: batch/v1
kind: Job
metadata:
  name: populate-web-content
spec:
  template:
    spec:
      containers:
      - name: content-writer
        image: busybox
        command: ["/bin/sh", "-c"]
        args:
          - echo "<h1>Hello to you! Have a nice day!</h1>" > /mnt/nfs/index.html;
        volumeMounts:
        - name: web-content
          mountPath: /mnt/nfs
      restartPolicy: OnFailure
      volumes:
      - name: web-content
        persistentVolumeClaim:
          claimName: nfs-pvc